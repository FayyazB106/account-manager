name: Build Release

# Builds cross-platform binaries and drafts a GitHub Release when a version tag
# (v*) is pushed. Windows + Linux are pure Go (modernc SQLite, no CGO) and
# cross-compile from one Linux runner. macOS is built on a mac runner WITH CGO,
# because its menu-bar tray icon uses Cocoa (fyne.io/systray).
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Build the frontend so go:embed can bake it into the binary.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Verify embedded frontend exists
        run: test -f internal/webui/dist/index.html

      # 2) Cross-compile Windows + Linux. CGO off = fully static, portable
      #    binaries. (macOS is built separately on a mac runner, with CGO.)
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile (Windows + Linux)
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          VER="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X main.version=${VER}"
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/account-manager-windows-amd64.exe ./cmd/api
          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/account-manager-linux-amd64      ./cmd/api

      # The macOS job builds its own binaries but needs the embedded frontend;
      # ship the built dist as an artifact so it doesn't rebuild npm.
      - name: Upload frontend dist (for the macOS job)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/webui/dist
          retention-days: 1

      # 3) Smoke-test the Linux binary on the runner: it must boot, serve the
      #    embedded SPA, and answer /api/health. Fails the release if it doesn't.
      - name: Smoke-test Linux binary
        run: |
          set -e
          SMOKE_DIR="$(mktemp -d)"
          MASTER_PASSPHRASE=ci-smoke-test DATA_DIR="$SMOKE_DIR" HOST=127.0.0.1 PORT=8099 \
            ./dist/account-manager-linux-amd64 &
          PID=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          spa=0
          if curl -fsS http://127.0.0.1:8099/ 2>/dev/null | grep -qi 'id="root"'; then spa=1; fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [ "$ok" != 1 ]; then echo "::error::/api/health did not respond"; exit 1; fi
          if [ "$spa" != 1 ]; then echo "::error::embedded SPA was not served"; exit 1; fi
          echo "Linux smoke test passed."

      # 4) Package the Linux tarball. Windows ships as an installer (package-windows
      #    job); the raw Windows exe is uploaded below only as that job's input.
      #    macOS is built entirely in the package-macos job.
      - name: Package Linux
        run: |
          mkdir -p release
          cat > dist/RUN.txt <<'EOF'
          Account Manager — run instructions

          Personal (this machine only):
            Run the binary from a terminal, then open the app in your browser at:
              http://localhost:8080
            On first run everything happens in the browser: you choose a passphrase
            (which protects the master key) and create the first admin account. On
            later starts you just enter the passphrase to unlock. Keep the terminal
            open while you use the app; close it (Ctrl+C) to stop the server.

          Server (a host, reachable over the network):
            Set MASTER_KEY in the environment (generate one with `-gen-key`) so it
            starts unattended, enable "Accessible on the network" in
            Settings -> Deployment, and map your domain to it with your reverse
            proxy (which should terminate TLS).

          See the docs for full details.
          EOF
          tar -C dist -czf release/account-manager-linux-amd64.tar.gz account-manager-linux-amd64 RUN.txt

      - name: Upload release archives (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: release/*
          retention-days: 1

      - name: Upload raw Windows exe (for the installer job)
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/account-manager-windows-amd64.exe
          retention-days: 1

  package-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The frontend was already built on the Linux job; reuse it so go:embed can
      # bake it in (no npm rebuild on the mac).
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/webui/dist
      - name: Verify embedded frontend exists
        run: test -f internal/webui/dist/index.html

      # Build BOTH arches with CGO (the menu-bar tray uses Cocoa), then lipo them
      # into one universal binary.
      - name: Build universal binary (CGO)
        run: |
          set -e
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME#v}"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -ldflags "$LDFLAGS" -o server-arm64 ./cmd/api
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" \
            go build -ldflags "$LDFLAGS" -o server-amd64 ./cmd/api
          lipo -create -output server server-arm64 server-amd64
          chmod +x server

      # Wrap it in a .app: a menu-bar agent (LSUIElement) with the app icon. It
      # runs hidden (no Terminal, no Dock icon) with -tray, showing a menu-bar icon
      # that opens the browser + offers Quit — matching the Windows tray. First-run
      # setup/unlock happen in the browser. Then package an UNSIGNED .dmg (first
      # launch needs a one-time right-click -> Open to clear Gatekeeper).
      - name: Build unsigned .dmg
        run: |
          set -e
          APP="staging/Account Manager.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp server "$APP/Contents/Resources/account-manager"
          chmod +x "$APP/Contents/Resources/account-manager"
          cp packaging/macos/appicon.icns "$APP/Contents/Resources/AppIcon.icns"

          # Wrapper: set the data dir, then exec the binary in -tray mode. exec
          # replaces the shell so the Go binary becomes the app's main process
          # (same PID) — so LSUIElement (menu-bar agent, no Dock/Terminal) applies.
          cat > "$APP/Contents/MacOS/Account Manager" <<'EOF'
          #!/bin/bash
          RES="$(cd "$(dirname "$0")/../Resources" && pwd)"
          export DATA_DIR="$HOME/.account-manager"
          mkdir -p "$DATA_DIR"
          exec "$RES/account-manager" -tray
          EOF
          chmod +x "$APP/Contents/MacOS/Account Manager"

          VER="${GITHUB_REF_NAME#v}"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Account Manager</string>
            <key>CFBundleIdentifier</key><string>com.accountmanager.app</string>
            <key>CFBundleName</key><string>Account Manager</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>LSUIElement</key><true/>
          </dict>
          </plist>
          EOF

          # Build the DMG in two steps with an explicit, generously-sized R/W
          # image, then compress it. (Letting hdiutil auto-size a UDZO directly
          # from -srcfolder can under-allocate and fail with "No space left on
          # device" while copying in.)
          NEEDED=$(du -sm staging | awk '{print $1}')
          SIZE=$(( NEEDED + 100 ))
          hdiutil create -volname "Account Manager" -srcfolder staging -fs HFS+ \
            -format UDRW -size "${SIZE}m" -ov raw.dmg
          hdiutil convert raw.dmg -format UDZO -o account-manager-macos.dmg
          rm -f raw.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: account-manager-macos.dmg
          retention-days: 1

  package-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dl
      - name: Stage installer files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item dl\account-manager-windows-amd64.exe stage\account-manager.exe
          Copy-Item packaging\windows\launch.vbs stage\launch.vbs
          Copy-Item packaging\windows\README.txt stage\README.txt
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = "${{ github.ref_name }}" -replace '^v',''
          # Source paths in the .iss resolve relative to the .iss folder, so pass
          # an ABSOLUTE stage dir. /O output lands under the working directory.
          $stage = Join-Path (Get-Location) 'stage'
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "/DStageDir=$stage" "/Ooutput" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: output/account-manager-setup.exe
          retention-days: 1

  release:
    needs: [build, package-macos, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      # Collect the final assets into one dir and checksum them by BASENAME, so the
      # in-app updater can verify a download against SHA256SUMS by asset filename.
      - name: Assemble assets + checksums
        run: |
          set -e
          mkdir -p out
          cp windows-installer/account-manager-setup.exe out/
          cp release-archives/account-manager-linux-amd64.tar.gz out/
          cp macos-dmg/account-manager-macos.dmg out/
          ( cd out && sha256sum * > SHA256SUMS )
          cat out/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Account Manager ${{ github.ref_name }}"
          fail_on_unmatched_files: true
          files: |
            out/account-manager-setup.exe
            out/account-manager-linux-amd64.tar.gz
            out/account-manager-macos.dmg
            out/SHA256SUMS
